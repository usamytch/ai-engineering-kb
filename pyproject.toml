[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidb"
version = "0.1.0"
description = "Evidence-first weekly review pipeline for AI engineering sources"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aidb = "aidb.cli:main"

[tool.setuptools.packages.find]
include = ["aidb*"]
